name: Cron Notifications

on:
  schedule:
    # 10:00 VET es 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  trigger-push:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al servidor de Vercel
        run: |
          curl -X GET "https://pidunet.vercel.app/api/cron/check-invoices"
