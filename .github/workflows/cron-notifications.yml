name: Cron Notifications

on:
  schedule:
    # 08:30 VET es 12:30 UTC
    - cron: '30 12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  trigger-push:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al servidor de Vercel
        run: |
          curl -X GET "https://pidunet.vercel.app/api/cron/check-invoices"
