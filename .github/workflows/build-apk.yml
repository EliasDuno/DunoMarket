name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: pidunet_mobile
        run: npm install

      - name: Build APK (Local to GitHub Runner)
        working-directory: pidunet_mobile
        run: eas build --platform android --profile preview --local --non-interactive --clear-cache --output ./app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m"
          _JAVA_OPTIONS: "-Xmx2560m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiduNet-APK
          path: pidunet_mobile/app-release.apk

